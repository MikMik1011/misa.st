baseURL: https://misa.st/
languageCode: en-us
title: Miša Stefanović
theme: PaperMod

# The only feed that matters is the blog's (/blog/index.xml); the site-wide
# one would pick up non-blog pages like the CV redirect.
outputs:
  home: [HTML]

params:
  sectionPagesMenu: main

  keywords: [Blog, Portfolio, CV]
  author: "Miša Stefanović"
  DateFormat: "2006/01/02"
  defaultTheme: auto

  label:
    text: "Home"

  profileMode:
    enabled: true
    subtitle: "Backend developer interested in cybersecurity and reverse engineering. FOSS enthusiast. BSc in IT, MSc student at PMF, University of Novi Sad."
    imageUrl: "userimg.jpg"
    imageTitle: "Profile picture"
    imageWidth: 120
    imageHeight: 120

  socialIcons:
    - name: email
      url: "mailto:contact@misa.st"
    - name: github
      url: "https://github.com/MikMik1011"
    - name: linkedin
      url: "https://linkedin.com/in/mikmik1011/"
    - name: cv
      url: "/cv.pdf"
    - name: rss
      url: "/blog/index.xml"


menu:
  main:
    - name: Blog
      identifier: blog
      url: /blog/
      weight: 10
    - name: CV
      identifier: cv
      url: /cv.pdf
      weight: 20
    - name: BGPP
      identifier: bgpp
      url: https://bgpp.misa.st
      weight: 30
      params:
        external: true

redirects:
  - from: /cv
    to: /cv.pdf
    status: 301
